[mgr]
ratio = [1, 3, 7]
show_hidden = true
show_symlink = true
sort_by = "alphabetical"
sort_dir_first = true
scrolloff = 10

[preview]
wrap = "yes"
tab_size = 2

[opener]
edit = [
  { run = 'sh ~/scripts/open-in-herdr.sh %s', orphan = true },
]

[[plugin.prepend_previewers]]
url = "*/"
run = 'faster-piper -- eza -TL=2 --color=always --icons=always --group-directories-first --no-quotes "$1"'

[[plugin.prepend_previewers]]
url = "*"
run = 'faster-piper -- bat --color=always --style=plain "$1"'
